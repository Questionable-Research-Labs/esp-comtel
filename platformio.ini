; PlatformIO Project Configuration File
;
; Environments:
;   <plugin> - one per src/plugins/*.cpp; compiles the ComtelPanel driver plus
;              exactly that one plugin. The block below is machine-owned;
;              regenerate it with `python tools/flash.py --sync`.
;              (protocol: docs/PROTOCOL.md)
;   diag     - the full interactive diagnostic firmware from the reverse-
;              engineering effort (kept buildable for hardware archaeology)
;
; Historical RE tools live in archive/ (see archive/README.md).
;
; Usage:  pio run -e scrolling_text -t upload --upload-port COM4
;         python tools/flash.py            (menu -> pick -> flash)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; >>> BEGIN generated envs — regenerate with tools/flash.py --sync; do not edit by hand
[env:bouncer]
build_src_filter = -<*> +<driver/> +<plugins/bouncer.cpp>
lib_deps = adafruit/Adafruit GFX Library

[env:button_test]
build_src_filter = -<*> +<driver/> +<plugins/button_test.cpp>
lib_deps = adafruit/Adafruit GFX Library

[env:entanglement]
build_src_filter = -<*> +<driver/> +<plugins/entanglement.cpp>
lib_deps = adafruit/Adafruit GFX Library

[env:row_uniformity]
build_src_filter = -<*> +<driver/> +<plugins/row_uniformity.cpp>
lib_deps = adafruit/Adafruit GFX Library

[env:scrolling_text]
build_src_filter = -<*> +<driver/> +<plugins/scrolling_text.cpp>
lib_deps = adafruit/Adafruit GFX Library

[env:tetris]
build_src_filter = -<*> +<driver/> +<plugins/tetris.cpp>
lib_deps = adafruit/Adafruit GFX Library

; <<< END generated

[env:diag]
build_src_filter = +<comtel_diag.cpp>
lib_deps = adafruit/Adafruit GFX Library
