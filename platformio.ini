; PlatformIO Project Configuration File
;
; Environments:
;   launcher - the plugin host (src/host/) with WiFi, the web control page and
;              OTA, plus every src/plugins/*.cpp. Needs include/secrets.h.
;   <plugin> - one solo env per src/plugins/*.cpp; the host without
;              networking plus exactly that one plugin, which runs at boot.
;              The block below is machine-owned; regenerate it with
;              `python tools/flash.py --sync`. (protocol: docs/PROTOCOL.md)
;   diag     - the full interactive diagnostic firmware from the reverse-
;              engineering effort (kept buildable for hardware archaeology)
;
; Historical RE tools live in archive/ (see archive/README.md).
;
; Usage:  pio run -e scrolling_text -t upload --upload-port COM4
;         python tools/flash.py            (menu -> pick -> flash)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; >>> BEGIN generated envs — regenerate with tools/flash.py --sync; do not edit by hand
[comtel_base]
build_src_filter = -<*> +<driver/> +<host/>
lib_deps = adafruit/Adafruit GFX Library
board_build.partitions = min_spiffs.csv

[env:launcher]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/>
build_flags = -DCOMTEL_WEB=1 -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps = ${comtel_base.lib_deps}
  mathieucarbou/ESPAsyncWebServer @ 3.6.0
  mathieucarbou/AsyncTCP @ 3.3.2
  bblanchon/ArduinoJson @ 7.4.3

[env:bouncer]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/bouncer.cpp>
build_flags = -DCOMTEL_WEB=0

[env:button_test]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/button_test.cpp>
build_flags = -DCOMTEL_WEB=0

[env:entanglement]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/entanglement.cpp>
build_flags = -DCOMTEL_WEB=0

[env:row_uniformity]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/row_uniformity.cpp>
build_flags = -DCOMTEL_WEB=0

[env:scrolling_text]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/scrolling_text.cpp>
build_flags = -DCOMTEL_WEB=0

[env:tetris]
extends = comtel_base
build_src_filter = ${comtel_base.build_src_filter} +<plugins/tetris.cpp>
build_flags = -DCOMTEL_WEB=0

; <<< END generated

[env:diag]
build_src_filter = +<comtel_diag.cpp>
lib_deps = adafruit/Adafruit GFX Library
