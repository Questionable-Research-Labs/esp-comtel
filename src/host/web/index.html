<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comtel sign</title>
<!-- Source of src/host/web_page.h: edit here, then run
     `python tools/embed_web.py` and commit both files. No external assets. -->
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6b66;
  --line: #deded9; --accent: #c2410c; --accent-fg: #ffffff;
  --err-bg: #fde8e8; --err-fg: #9b1c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #20201e; --fg: #ececea; --muted: #9a9a94;
    --line: #34342f; --accent: #fb923c; --accent-fg: #161615;
    --err-bg: #3b1515; --err-fg: #fca5a5;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 520px; margin: 0 auto; }
h1 { font-size: 1.25rem; margin: 0 0 4px; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
     color: var(--muted); margin: 24px 0 8px; }
#status { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
#error { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
         background: var(--err-bg); color: var(--err-fg); white-space: pre-line; }
ul { list-style: none; margin: 0; padding: 0; }
li button {
  width: 100%; text-align: left; margin: 0 0 8px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  color: var(--fg); font: inherit; cursor: pointer;
}
li button .id { display: block; font-size: .8rem; color: var(--muted); }
li button.active { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
li button.active .id::after { content: " \2022  running"; color: var(--accent); }
form { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 14px; }
label { display: block; margin: 0 0 14px; }
label > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
label.check { display: flex; align-items: center; gap: 10px; }
label.check > span { margin: 0; color: var(--fg); font-size: 1rem; }
input[type=text], input[type=number], select {
  width: 100%; padding: 10px; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
}
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
form button {
  width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0;
  border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer;
}
form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Comtel sign</h1>
  <div id="status">Connecting&hellip;</div>
  <div id="error" role="alert"></div>

  <h2>Plugins</h2>
  <ul id="plugins"></ul>

  <section id="settings-section" hidden>
    <h2 id="settings-title">Settings</h2>
    <form id="settings"></form>
  </section>
</main>
<script>
"use strict";
const POLL_MS = 3000;
let state = null;        // last /api/state
let formFor = null;      // plugin id the settings form was built for
let dirty = false;       // user has edited the form since it was (re)built
let busy = false;

const $ = (id) => document.getElementById(id);

function showError(msg) {
  const e = $("error");
  e.textContent = msg || "";
  e.style.display = msg ? "block" : "none";
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) { /* empty body */ }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

async function refresh() {
  try {
    state = await api("GET", "/api/state");
    $("status").textContent = "Connected";
    render();
  } catch (err) {
    $("status").textContent = "Can't reach the sign (" + err.message + ")";
  }
}

function render() {
  const list = $("plugins");
  list.replaceChildren();
  for (const p of state.plugins) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = p.id === state.active ? "active" : "";
    b.append(p.label || p.id);
    const id = document.createElement("span");
    id.className = "id";
    id.textContent = p.id;
    b.append(id);
    b.onclick = () => run(p.id);
    const li = document.createElement("li");
    li.append(b);
    list.append(li);
  }

  const active = state.plugins.find((p) => p.id === state.active);
  const section = $("settings-section");
  if (!active || active.settings.length === 0) {
    section.hidden = true;
    formFor = null;
    return;
  }
  section.hidden = false;
  // Don't clobber edits in progress; rebuild on a switch or when clean.
  if (formFor === active.id && dirty) return;
  buildForm(active);
}

function buildForm(plugin) {
  $("settings-title").textContent = (plugin.label || plugin.id) + " settings";
  const form = $("settings");
  form.replaceChildren();
  for (const s of plugin.settings) {
    const label = document.createElement("label");
    const name = document.createElement("span");
    name.textContent = s.label;
    let input;
    if (s.type === "bool") {
      label.className = "check";
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = s.value === "1";
      label.append(input, name);
    } else {
      if (s.type === "choice") {
        input = document.createElement("select");
        for (const o of s.options) {
          const opt = document.createElement("option");
          opt.value = opt.textContent = o;
          input.append(opt);
        }
      } else {
        input = document.createElement("input");
        if (s.type === "int") {
          input.type = "number";
          input.min = s.min; input.max = s.max; input.step = 1;
          input.inputMode = "numeric";
        } else {
          input.type = "text";
          input.maxLength = s.max;
        }
      }
      input.value = s.value ?? "";
      label.append(name, input);
    }
    input.dataset.key = s.key;
    input.dataset.orig = s.type === "bool" ? (input.checked ? "1" : "0") : input.value;
    input.addEventListener("input", () => { dirty = true; });
    input.addEventListener("change", () => { dirty = true; });
    form.append(label);
  }
  const apply = document.createElement("button");
  apply.type = "submit";
  apply.textContent = "Apply";
  form.append(apply);
  formFor = plugin.id;
  dirty = false;
}

function valueOf(input) {
  return input.type === "checkbox" ? (input.checked ? "1" : "0") : input.value;
}

async function run(id) {
  if (busy) return;
  busy = true;
  showError("");
  try {
    await api("POST", "/api/run", { id });
    dirty = false;
    formFor = null;
    await new Promise((r) => setTimeout(r, 300));  // let the loop apply it
  } catch (err) {
    showError("Couldn't switch to " + id + ": " + err.message);
  }
  busy = false;
  refresh();
}

$("settings").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (busy || !formFor) return;
  busy = true;
  showError("");
  const button = ev.target.querySelector("button");
  button.disabled = true;
  const errors = [];
  // Send only what changed, one setting at a time, in form order.
  for (const input of ev.target.querySelectorAll("[data-key]")) {
    const value = valueOf(input);
    if (value === input.dataset.orig) continue;
    try {
      await api("POST", "/api/setting", { id: formFor, key: input.dataset.key, value });
      input.dataset.orig = value;
    } catch (err) {
      errors.push(input.dataset.key + ": " + err.message);
    }
  }
  if (errors.length) showError(errors.join("\n"));
  await new Promise((r) => setTimeout(r, 300));
  dirty = errors.length > 0;   // keep a rejected value on screen to fix
  button.disabled = false;
  busy = false;
  refresh();
});

refresh();
setInterval(() => { if (!busy) refresh(); }, POLL_MS);
</script>
</body>
</html>
