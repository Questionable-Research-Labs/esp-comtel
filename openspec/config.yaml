schema: spec-driven

# Project context -- shown to AI when creating artifacts.
context: |
  Hardware: ESP32 devkit (esp32dev / WROOM-32) driving an old Comtel 96x16 RGB
  LED sign (six daisy-chained 16x16 modules) directly, through two 74HCT245
  level shifters on the panel's 20-pin ribbon. The protocol was
  reverse-engineered; docs/PROTOCOL.md is the reference, docs/wiring.md the
  wiring, docs/HISTORY.md the story. Up to six buttons to GND (pins in
  src/driver/button_pins.h).

  Build: PlatformIO, Arduino framework, Adafruit GFX. One firmware image per
  plugin: platformio.ini has a machine-owned block with one [env:<id>] per
  plugin (regenerated by `python tools/flash.py --sync`), plus a hand-written
  [env:diag] for the frozen reverse-engineering firmware (src/comtel_diag.cpp).
  `python tools/flash.py [<id>] [--port COMx] [--no-upload]` builds/flashes.

  Plugins: each app is one self-contained src/plugins/<id>.cpp (id = filename
  stem) with its own setup()/loop(), an optional `// @plugin: <label>` first
  line, and private .h data headers if needed. Plugins depend only on
  src/driver/ (ComtelPanel + button_pins.h), never on each other.

  Driver contract: draw on panel.canvas (96x16 GFXcanvas8, low 3 bits = RGB
  on/off, use COMTEL_* constants), call panel.show() to push a frame,
  panel.service() continuously to keep the display multiplexed. Display is
  CPU-scanned; anything that starves service() or masks interrupts for long
  causes flicker or uneven row brightness.

  Specs follow the code: when a spec, comment or README disagrees with the
  code, the code is the truth and the docs are corrected.

  Repo: github.com/Questionable-Research-Labs/esp-comtel. Dev PC is Windows;
  the board enumerates as a CP210x (usually COM4).

