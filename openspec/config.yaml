schema: spec-driven

# Project context -- shown to AI when creating artifacts.
context: |
  Hardware: ESP32 devkit (esp32dev / WROOM-32) driving an old Comtel 96x16 RGB
  LED sign (six daisy-chained 16x16 modules) directly, through two 74HCT245
  level shifters on the panel's 20-pin ribbon. The protocol was
  reverse-engineered; docs/PROTOCOL.md is the reference, docs/wiring.md the
  wiring, docs/HISTORY.md the story. Up to six buttons to GND (pins in
  src/driver/button_pins.h).

  Build: PlatformIO, Arduino framework, Adafruit GFX, min_spiffs.csv (two
  1.9 MB OTA slots). platformio.ini has a machine-owned block (regenerated by
  `python tools/flash.py --sync`): [comtel_base], [env:launcher] (host with
  WiFi/web/OTA, COMTEL_WEB=1, plus every plugin) and one solo [env:<id>] per
  plugin (host without networking, COMTEL_WEB=0, plus that plugin), and a
  hand-written [env:diag] for the frozen reverse-engineering firmware
  (src/comtel_diag.cpp). `python tools/flash.py [launcher|<id>] [--port COMx]
  [--no-upload] [--ota [host]]` builds/flashes. The launcher needs the
  gitignored include/secrets.h (template: include/secrets.example.h).

  Host: src/host/ owns the only Arduino setup()/loop(), the single
  ComtelPanel and Serial.begin(); loop() = service() -> apply queued
  commands -> active plugin's tick(). Switching = stop -> reset driver
  calibration -> blank -> start (always a fresh start). In the launcher, the
  async web server (core 0) only queues commands; the main loop applies them.

  Plugins: each app is one self-contained src/plugins/<id>.cpp (id = filename
  stem) implementing start(panel)/tick(panel)[/stop] inside an anonymous
  namespace and registering with COMTEL_PLUGIN(id, "label", start, tick,
  stop[, settings]); an optional `// @plugin: <label>` first line, and
  private .h data headers if needed. Plugins depend only on src/driver/
  (ComtelPanel + button_pins.h) and src/host/plugin.h, never on each other.

  Driver contract: draw on panel.canvas (96x16 GFXcanvas8, low 3 bits = RGB
  on/off, use COMTEL_* constants), call panel.show() to push a frame,
  panel.service() continuously to keep the display multiplexed. Display is
  CPU-scanned; anything that starves service() or masks interrupts for long
  causes flicker or uneven row brightness.

  Specs follow the code: when a spec, comment or README disagrees with the
  code, the code is the truth and the docs are corrected.

  Repo: github.com/Questionable-Research-Labs/esp-comtel. Dev PC is Windows;
  the board enumerates as a CP210x (usually COM4).

